name: DCike iOS Test Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      FLUTTER_SUPPRESS_ANALYTICS: "true"
      COCOAPODS_DISABLE_STATS: "true"
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Read pinned Flutter version
        id: flutter-version
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re

          with open(".fvmrc", encoding="utf-8") as source:
              version = json.load(source)["flutter"]
          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              raise SystemExit("Expected a pinned Flutter release in .fvmrc")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          channel: stable
          cache: true

      - name: Set up Rust for iPhone
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Prepare iOS dependencies
        run: |
          set -euo pipefail
          flutter config --no-analytics
          flutter --version
          xcodebuild -version
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          if [ "${sdk_version%%.*}" -lt 26 ]; then
            echo 'DCike native Liquid Glass requires Xcode 26 / iOS SDK 26 or newer.' >&2
            exit 1
          fi
          rustc --version
          flutter precache --ios
          flutter pub get

      - name: Build unsigned iPhone app
        run: |
          set -uo pipefail
          build_log="$RUNNER_TEMP/dcike-ios-build.log"
          export SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          export CARGO_TARGET_AARCH64_APPLE_IOS_LINKER="$(xcrun --sdk iphoneos --find clang)"
          export IPHONEOS_DEPLOYMENT_TARGET="15.0"
          export CFLAGS_aarch64_apple_ios="-miphoneos-version-min=$IPHONEOS_DEPLOYMENT_TARGET -isysroot $SDKROOT"
          export CXXFLAGS_aarch64_apple_ios="$CFLAGS_aarch64_apple_ios"
          export CARGO_TARGET_AARCH64_APPLE_IOS_RUSTFLAGS="-C link-arg=-miphoneos-version-min=$IPHONEOS_DEPLOYMENT_TARGET"
          export RUSTFLAGS="$CARGO_TARGET_AARCH64_APPLE_IOS_RUSTFLAGS"
          set +e
          flutter build ios --release --no-codesign --no-pub --dart-define=dcike_enable_remote_diagnostics=false --split-debug-info=build/symbols 2>&1 | tee "$build_log"
          status=${PIPESTATUS[0]}
          set -e
          echo "Flutter build exit code: $status" >> "$build_log"
          exit "$status"

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dcike-ios-build-diagnostics
          path: |
            ${{ runner.temp }}/dcike-ios-build.log
            build/ios/Runner.buildlog/**
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6

      - name: Package IPA for SideStore
        run: |
          set -euo pipefail
          app="build/ios/iphoneos/Runner.app"
          test -d "$app"
          plutil -lint "$app/Info.plist"
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")
          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")
          test "$bundle_id" = 'app.dcike.reader'
          lipo "$app/$executable" -verify_arch arm64
          package_dir="$RUNNER_TEMP/dcike-ipa"
          mkdir -p "$package_dir/Payload"
          ditto "$app" "$package_dir/Payload/Runner.app"
          (
            cd "$package_dir"
            zip -qry "$GITHUB_WORKSPACE/DCike-iOS.ipa" Payload
          )
          unzip -tq DCike-iOS.ipa
          {
            echo 'DCike-iOS.ipa is an unsigned iPhone build.'
            echo 'Download the ios-ipa artifact and sign/install the IPA using SideStore.'
            echo 'Minimum supported iOS version: 15.0.'
            echo 'Native Liquid Glass requires iOS 26; earlier iOS uses native material blur.'
            echo 'DCike uses the independent bundle identifier app.dcike.reader.'
            echo 'After importing this build into LiveContainer, use its built-in Create Home Screen Icon feature.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload IPA
        uses: actions/upload-artifact@v6
        with:
          name: ios-ipa
          path: DCike-iOS.ipa
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
